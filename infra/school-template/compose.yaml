# FL-ReportCard, school-hosted profile (ADR-055): one server, one public
# origin, five containers on a private network. Only `web` publishes ports.
#
# The two application images are pinned to a release. Dependabot proposes the
# bump; merging that pull request is the approval, and the deploy workflow
# applies it. Rolling back is reverting the pull request.
#
# Secrets live only in `.env` on the server (see .env.example); this file
# holds nothing sensitive and is safe to commit.

name: flrc

x-backend: &backend
  image: ghcr.io/suatsulun/flrc-backend:1.0.0
  env_file: .env
  environment:
    ENV: school
    SCHOOL_BRANDING_DIR: /srv/branding
    WORKER_HEALTH_URL: http://worker:10000/health
  volumes:
    - ./branding:/srv/branding:ro
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  restart: unless-stopped

services:
  web:
    image: ghcr.io/suatsulun/flrc-web:1.0.0
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set the public hostname in .env}
      API_UPSTREAM: api:8000
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./branding:/srv/branding:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    mem_limit: 256m

  # One-shot: applies pending migrations before the API and worker start.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # School mode redirects plain HTTP and checks the Host header, so the
      # probe presents itself the way Caddy would. TRUSTED_HOSTS must include
      # "localhost" (see .env.example).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/healthz', headers={'X-Forwarded-Proto': 'https', 'Host': 'localhost'}), timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g

  worker:
    <<: *backend
    command: ["./bin/start-worker-web.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:10000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flrc}
    volumes:
      # PostgreSQL 18 keeps its data below /var/lib/postgresql (ADR-020).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flrc} -d ${POSTGRES_DB:-flrc}"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped
    mem_limit: 1g

  redis:
    image: redis:8-alpine
    # Sessions and queued export jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
