name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  # Dispatched by the dependabot merge workflow; see ci.yml.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan repository history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          # No install happens in this job, so there is no pnpm store to cache;
          # the post-step would fail trying to save a path that never exists.

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"

      - name: Export locked production Python dependencies
        working-directory: apps/backend
        run: >-
          uv export --frozen --no-dev --no-emit-project --format requirements-txt
          --output-file "$RUNNER_TEMP/flrc-requirements.txt"

      - name: Audit production Python dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          -r "$RUNNER_TEMP/flrc-requirements.txt"
          --no-deps --disable-pip --progress-spinner off

      # OSV also covers GitHub advisories that may not yet appear in PyPI's feed.
      - name: Audit production Python dependencies against OSV
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          -r "$RUNNER_TEMP/flrc-requirements.txt"
          --no-deps --disable-pip --progress-spinner off --vulnerability-service osv

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review
    if: >-
      ${{ github.event_name == 'pull_request' &&
          (github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
