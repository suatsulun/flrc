name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify branding is applied
        run: pnpm brand:check

      - name: Test branding file replacement
        run: pnpm brand:test

      - name: Lint, typecheck, and build
        run: pnpm turbo run lint typecheck build --filter='!@flrc/backend'

      - name: Verify the assembled demo web output
        run: test -f infra/vercel/dist/index.html && test -f infra/vercel/dist/admin/index.html

  python:
    name: Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    env:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://flrc:flrc@localhost:5432/flrc
      DATABASE_URL_DIRECT: postgresql+asyncpg://flrc:flrc@localhost:5432/flrc
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flrc
          POSTGRES_PASSWORD: flrc
          POSTGRES_DB: flrc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flrc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/flrc

      - name: Create migration test database
        env:
          PGPASSWORD: flrc
        run: psql -h localhost -U flrc -d postgres -c "create database flrc_test;"

      - name: Pytest
        run: uv run pytest -q

  contract:
    name: API contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: apps/backend
        run: uv sync --frozen

      - name: Regenerate API client
        run: pnpm generate

      - name: Check for generated drift
        run: git diff --exit-code -- packages/api-client

  infra:
    name: Deployment templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate the school Compose template
        working-directory: infra/school-template
        run: |
          # The services require a real .env at deploy time; validation uses the
          # example, with throwaway values for the guarded settings.
          cp .env.example .env
          SITE_ADDRESS=validate.example GATEWAY_SECRET=validate POSTGRES_PASSWORD=validate \
            docker compose -f compose.yaml config --quiet

      - name: Validate the web Caddyfile
        run: >-
          docker run --rm -e SITE_ADDRESS=:80 -e GATEWAY_SECRET=validate
          -v "$PWD/infra/web/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate the cloud-init file
        run: python3 -c "import yaml, sys; yaml.safe_load(open('infra/hetzner/cloud-init.yaml'))"

  e2e:
    name: Browser E2E
    needs: [js, python, contract]
    runs-on: ubuntu-latest
    env:
      ENV: test
      E2E_AUTH_SECRET: ci-only-synthetic-secret
      ALLOWED_GOOGLE_DOMAIN: example-school.k12.tr
      DATABASE_URL: postgresql+asyncpg://flrc:flrc@localhost:5432/flrc
      DATABASE_URL_DIRECT: postgresql+asyncpg://flrc:flrc@localhost:5432/flrc
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_ORIGIN: http://localhost:4173
      ADMIN_ORIGIN: http://localhost:5174
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flrc
          POSTGRES_PASSWORD: flrc
          POSTGRES_DB: flrc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flrc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run flrc seed-e2e
          uv run uvicorn flrc.main:app --host 127.0.0.1 --port 8000 > /tmp/flrc-api.log 2>&1 &
      - run: |
          pnpm --filter @flrc/teacher build
          pnpm --filter @flrc/admin build
          pnpm --filter @flrc/teacher preview --host 127.0.0.1 > /tmp/flrc-web.log 2>&1 &
          pnpm --filter @flrc/admin preview --host 127.0.0.1 --port 5174 > /tmp/flrc-admin.log 2>&1 &
          pnpm exec playwright install --with-deps chromium
          for i in {1..30}; do curl -fsS http://localhost:4173/api/healthz && break; sleep 1; done
          for i in {1..30}; do curl -fsS http://localhost:5174/admin/ && break; sleep 1; done
          pnpm e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
