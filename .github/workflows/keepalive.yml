name: keepalive
on:
  schedule:
    - cron: "*/10 5-14 * * 1-5" # every 10 min, 05:00–14:59 UTC, weekdays = Turkish school hours
  workflow_dispatch:
jobs:
  ping:
    # Scheduled operations are opt-in; manual runs still validate required secrets.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEMO_KEEPALIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://flrc-api.onrender.com/api/healthz
